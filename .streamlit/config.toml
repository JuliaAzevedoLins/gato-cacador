# Tema "papel e nanquim": combina com o traço dos gatinhos (ui/estilo.py usa as mesmas cores).
[theme]
base = "light"
primaryColor = "#E07A2E"              # laranja (toggles, foco)
backgroundColor = "#FBF6EE"           # papel
secondaryBackgroundColor = "#F4EADB"  # papel mais escuro (barra lateral)
textColor = "#2B2118"                 # nanquim
linkColor = "#B0561A"
borderColor = "#2B2118"
baseRadius = "12px"
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
